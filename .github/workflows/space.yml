name: Refresh profile artwork

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh real contribution data and artwork
        run: python3 scripts/compose_profile.py --refresh-activity
      - name: Commit updated artwork
        run: |
          if git diff --quiet -- assets/profile.svg assets/profile-static.svg design/activity.json; then
            exit 0
          fi
          git add assets/profile.svg assets/profile-static.svg design/activity.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh profile contribution artwork"
          git push
